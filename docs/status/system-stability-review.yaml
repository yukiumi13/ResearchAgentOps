executive_summary: >-
  The local core is a release candidate, not a production-stable control plane.
  Historical and post-export requirements are traceable, 931 tests pass, the
  Python lint baseline is clean, and measured local paths are responsive. Live
  protected deployment and external transports remain the dominant stability
  gaps.
capabilities:
- key: requirement-coverage
  title: Requirement and workflow coverage
  status: verified_local
  summary: >-
    All 77 historical prompt anchors map to 33 stable scenarios, every scenario
    has one of 16 workflow rows and an honest status, and later requirements are
    tracked separately rather than hidden in the historical count.
  evidence_keys:
  - historical
  - scenarios
  - requirements
  - workflows
  - traceability-tests
- key: local-core
  title: Local governed workflow
  status: partial
  summary: >-
    Typed records, local Sessions and Runs, Submission and Impact proposals,
    deterministic validation, document contracts, and recovery behavior have
    executable local coverage.
  evidence_keys:
  - source-tree
  missing:
  - Protected-repository, GitHub App author, Plan reviewer, Linear, SSH, and live provider pilots remain.
- key: source-quality
  title: Source quality gate
  status: verified_local
  summary: >-
    The review removed the 183-finding Ruff baseline, fixed runtime annotation
    introspection and a host-dependent tmux integration fixture, and adds
    full-repository Ruff plus pytest to the exact-head source workflow.
  evidence_keys:
  - ci-workflow
- key: performance
  title: Local performance envelope
  status: partial
  summary: >-
    Cold CLI and document commands take about 0.55 to 0.68 seconds on cm04. A
    50-item, 200-sample warm diagnostic measured inbox reads at p95 0.777 ms and
    rendering at p95 1.975 ms with zero failures.
  evidence_keys:
  - benchmark-contract
  missing:
  - The required 30-minute end-to-end production window and external queue measurements have not run.
- key: language-fitness
  title: Python language fitness
  status: verified_local
  summary: >-
    No measured local path justifies a rewrite. Python matches Pydantic, Typer,
    SQLite, subprocess, and MkDocs boundaries; network, GitHub queue, Git, and
    remote process latency dominate the unfinished workflows.
  evidence_keys:
  - benchmark-contract
  - source-tree
- key: document-library
  title: Validated document library
  status: verified_local
  summary: >-
    The policy remains taxonomy authority while a digest-bound manifest feeds
    an optional strict MkDocs build without a second navigation truth.
  evidence_keys:
  - document-site
- key: protected-acceptance
  title: Protected manager acceptance
  status: deployment_pending
  summary: >-
    The repository contains exact-head workflows, CODEOWNERS, governance models,
    and audit/apply adapters, but GitHub currently reports no active ruleset or
    classic main protection.
  evidence_keys:
  - governance
  missing:
  - Audit required checks, latest CODEOWNER approval, strict base currency, and protected-main rules.
- key: proposal-identity
  title: Distinct GitHub proposal identity
  status: partial
  summary: >-
    GitHub App 4577593 and installation 153350892 were observed on the selected
    ResearchAgentOps repository with exactly metadata read, contents write, and
    pull requests write. The local broker implementation has adversarial
    credential and identity tests.
  evidence_keys:
  - github-app-installation
  - proposal-broker-tests
  missing:
  - Manager acceptance, an Agent-inaccessible broker service principal, and a live rcp-agent[bot] canary remain.
active_work:
- key: github-app-identity
  summary: Accept and deploy the distinct GitHub App proposal broker
  state: active
  owner: person:yukiumi13
  next_action: Review the broker PR, deploy it under an Agent-inaccessible principal, then run the first bot-authored canary.
risks:
- key: unprotected-main
  severity: high
  risk: Green workflows are advisory while main has no active GitHub merge rule.
  mitigation: Apply the reviewed governance policy and verify it with researchctl github doctor.
- key: module-hotspots
  severity: medium
  risk: >-
    RuntimeStore, ApplicationService, domain models, CI dispatch, and document
    linting are large change surfaces; lint_document_tree alone is 469 lines.
  mitigation: >-
    Split only observed domain and transaction hotspots behind existing facades,
    with characterization tests and no second database or state machine.
- key: external-evidence
  severity: medium
  risk: Fake ports and local adapters do not prove real GitHub, Linear, SSH, or provider behavior.
  mitigation: Run the R1 protected-repository shadow pilot before expanding the product surface.
- key: shared-broker-uid
  severity: high
  risk: A mode-0400 private key remains readable to an Agent process that shares the broker Unix UID.
  mitigation: Move the key and one-shot host to a distinct principal before any live proposal canary.
decisions_needed: []
next_steps:
- Review and merge the App proposal broker without treating the implementing Agent as acceptance.
- Deploy the broker under a distinct principal and run one rcp-agent[bot] canary before applying protection.
- Apply and audit protected main governance after the App-authored canary.
- Run the live Plan reviewer and Linear shadow pilots from one exact release commit.
- Split the document tree validator and notification transactions only after hotspot-specific characterization tests exist.
- Retain Python until a recorded workload violates the supported latency or scale envelope.
