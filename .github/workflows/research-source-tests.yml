name: research-source-tests

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: research-source-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  source-tests:
    name: researchctl/source-tests
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ACTIONLINT_VERSION: "1.7.12"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUTF8: "1"
      RCP_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      RCP_BASE_SHA: ${{ github.event.pull_request.base.sha }}

    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify exact pull request head
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RCP_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RCP_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          observed_head="$(git rev-parse --verify HEAD^{commit})"
          if [[ "$observed_head" != "$RCP_HEAD_SHA" ]]; then
            echo "::error::Checked-out source differs from the event's exact head"
            exit 2
          fi

      - name: Lint GitHub workflows
        shell: bash
        env:
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --show-error --silent --location \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"

      - name: Materialize immutable document baseline
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/researchctl-base" "$RCP_BASE_SHA"

      - name: Install pull request source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/researchctl-source-tests"
          "$RUNNER_TEMP/researchctl-source-tests/bin/python" -m pip install '.[dev]'

      - name: Run source tests
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/researchctl-source-tests/bin/python" -m pytest

      - name: Lint project document hierarchy
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/researchctl-source-tests/bin/researchctl" doc tree \
            --project "$GITHUB_WORKSPACE" \
            --baseline-project "$RUNNER_TEMP/researchctl-base"
