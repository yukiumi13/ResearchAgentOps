name: research-validate-pr

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: research-validate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  exact-head:
    name: researchctl/exact-head
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUTF8: "1"
      RCP_BASE_REF: ${{ github.event.pull_request.base.ref }}
      RCP_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      RCP_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      RCP_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      RCP_PR_NUMBER: ${{ github.event.pull_request.number }}
      RCP_REPOSITORY: ${{ github.repository }}

    steps:
      # This is the protected base, never the pull request head or merge tree.
      - name: Check out protected validator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Require installed CODEOWNERS policy
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s .github/CODEOWNERS ]]; then
            echo "::error::.github/CODEOWNERS is not installed; see docs/CODEOWNERS_CONTRACT.md"
            exit 2
          fi

      - name: Fetch pull request head as data
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RCP_PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$RCP_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RCP_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin \
            "+refs/pull/${RCP_PR_NUMBER}/head:refs/researchctl/pr-head"
          git config --local --unset-all http.https://github.com/.extraheader || true
          fetched_head="$(git rev-parse --verify 'refs/researchctl/pr-head^{commit}')"
          if [[ "$fetched_head" != "$RCP_HEAD_SHA" ]]; then
            echo "::error::Fetched PR head differs from the event's exact head"
            exit 2
          fi

      # Installation and execution use only files from the protected base checkout.
      - name: Install protected validator
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/researchctl-validator"
          "$RUNNER_TEMP/researchctl-validator/bin/python" -m pip install .

      - name: Validate exact head
        shell: bash
        env:
          RCP_ARTIFACT: ${{ runner.temp }}/researchctl-ci-attestation.yaml
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/researchctl-validator/bin/researchctl" ci dispatch \
            --project "$GITHUB_WORKSPACE" \
            --artifact "$RCP_ARTIFACT" \
            --repository "$RCP_REPOSITORY" \
            --pull-request-number "$RCP_PR_NUMBER" \
            --subject-head "$RCP_HEAD_SHA" \
            --base-commit "$RCP_BASE_SHA" \
            --head-ref "$RCP_HEAD_REF" \
            --base-ref "$RCP_BASE_REF"

      - name: Upload exact-head attestation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: researchctl-ci-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/researchctl-ci-attestation.yaml
          if-no-files-found: error
          overwrite: false
          retention-days: 30
